<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PHY2ICK</title>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <div class="top-left">
      <div id="money">$500</div>
      <div class="hp"><div id="hpfill"></div></div>
    </div>
    <div id="fps"></div>
    <div id="toasts"></div>
    <div id="prompt"></div>
    <div id="speedo"></div>
    <div id="bubbles"></div>
    <div id="waypoint"></div>
    <div id="wheel"></div>
    <div id="help">
      <b>Test area</b> <small>(<kbd>H</kbd> hides this)</small>
      <div><kbd>WASD</kbd> move · <kbd>Shift</kbd> run · <kbd>Space</kbd> jump</div>
      <div><kbd>E</kbd> (hold) talk to someone: the wheel</div>
      <div><kbd>F</kbd> get in / out of a car</div>
      <div>In a car: <kbd>W</kbd>/<kbd>S</kbd> drive / brake · <kbd>A</kbd>/<kbd>D</kbd> steer · <kbd>Space</kbd> handbrake</div>
      <div><kbd>C</kbd> inside view · <kbd>R</kbd> flip the car back over · mouse to look</div>
    </div>
  </div>
  <div id="splash">
    <div class="logo"><span>PHY</span><span class="two">2<i>2</i></span><span>ICK</span></div>
    <div class="sub">TEST AREA</div>
    <div class="go">Click to play</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
