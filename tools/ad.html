<!doctype html><html><head><meta charset="utf-8"><title>Paul's TV advert (frames)</title></head>
<body style="margin:0;background:#000"><canvas id="c" width="1280" height="800"></canvas>
<script type="module">
import { drawPaulAd } from '../src/paul.js';
const c = document.getElementById('c'), x = c.getContext('2d');
drawPaulAd(x, c.width, c.height, 0); // (starts the billboard image loading)
const img = new Image(); img.src = import.meta.env.BASE_URL + 'paul-billboard.jpg'; img.onload = () => { window.ready = true; };
window.frame = (t) => { drawPaulAd(x, c.width, c.height, t); return c.toDataURL('image/jpeg', 0.92); };
</script></body></html>
